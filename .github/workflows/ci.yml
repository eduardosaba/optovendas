name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1º Passo: Instalar o pnpm primeiro
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 2º Passo: Instalar o Node.js e SÓ AGORA configurar o cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint